<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>FriendChat</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOGIN -->
<div id="login">

  <div class="card">

    <h1>FriendChat</h1>

    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">

    <button class="primary" onclick="signup()">Sign Up</button>
    <button onclick="login()">Login</button>

    <p id="friendCode"></p>

  </div>

</div>

<!-- APP -->
<div id="app">

  <!-- SIDEBAR -->
  <div id="sidebar">

    <div class="profile">
      <div class="name" id="myName">User</div>

      <div class="codeBox">
        <span id="myCode">------</span>
        <button class="small" onclick="copyCode()">Copy</button>
      </div>
    </div>

    <hr>

    <div class="sectionTitle">Add Friend</div>

    <input id="friendInput" placeholder="Friend Code">
    <button class="primary" onclick="addFriend()">Send Request</button>

    <hr>

    <div class="sectionTitle">Requests</div>
    <div id="requests"></div>

    <hr>

    <div class="sectionTitle">Friends</div>
    <ul id="friends"></ul>

  </div>

  <!-- CHAT -->
  <div id="chat">

    <div id="chatHeader">
      <div id="chatTitle">Select a friend</div>
    </div>

    <div id="messages">
      <div class="empty">No chat selected</div>
    </div>

    <div id="chatBottom">

      <input id="messageBox" placeholder="Message...">
      <button class="primary" onclick="sendMessage()">Send</button>

    </div>

  </div>

</div>

<script src="app.js"></script>

</body>
</html>
